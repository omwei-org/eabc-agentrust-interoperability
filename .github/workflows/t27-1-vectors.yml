name: T27.1 interoperability vectors
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_t27_1_interoperability_vectors.py
        env: {PYTHONPATH: .}
