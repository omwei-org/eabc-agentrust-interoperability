name: T30.1 cMCP adapter integration harness

on:
  push:
    branches:
      - t29-3-execution-binding
  workflow_dispatch:

jobs:
  t30-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned cMCP
        run: |
          git clone https://github.com/agentrust-io/cmcp.git upstream/cmcp
          git -C upstream/cmcp checkout f8743e013786b094caaa70c336519834e73c74d5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e "upstream/cmcp[dev]"
      - name: Run EABC seam tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_t29_3_execution_binding.py tests/test_t29_4_execution_admission.py tests/test_t30_admission_contract.py tests/test_t30_1_cmcp_adapter.py
