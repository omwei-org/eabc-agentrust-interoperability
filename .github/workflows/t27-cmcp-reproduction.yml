name: T27 pinned cMCP reproduction
on:
  workflow_dispatch:
jobs:
  cmcp-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned cMCP
        run: |
          git clone https://github.com/agentrust-io/cmcp.git upstream/cmcp
          git -C upstream/cmcp checkout d03b9af504535d3d43f192bc6d9eff89b8afd12f
          git -C upstream/cmcp rev-parse HEAD
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install cMCP
        working-directory: upstream/cmcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pinned interoperability seam
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: |
          pytest -q tests/test_t26_2_real_proxy_adapter.py tests/test_t26_3_negative_conformance.py tests/test_t25_cmcp_runtime_seam.py
