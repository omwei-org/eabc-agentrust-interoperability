name: T26.5 evidence bundle verifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify T26.5 bundle
        run: pytest -q tests/test_t26_5_evidence_bundle.py
