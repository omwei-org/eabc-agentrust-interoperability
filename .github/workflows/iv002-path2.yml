name: IV-002 Path-2

on:
  push:
    branches: [iv002-path2-shared-controlled-event]
  pull_request:

jobs:
  controlled-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Path-2 checks
        run: pytest -q tests/test_iv002_path2.py
