name: T35 external authority-state

on:
  workflow_dispatch:
  push:
    branches:
      - t32-execution-boundary-exclusivity

jobs:
  t35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned cMCP
        run: |
          git clone https://github.com/agentrust-io/cmcp.git upstream/cmcp
          git -C upstream/cmcp checkout f8743e013786b094caaa70c336519834e73c74d5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e "upstream/cmcp[dev]"
      - name: Apply disposable T35 patch
        run: python scripts/t35_apply_patch.py
      - name: Run T35
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: pytest -q tests/test_t35_external_authority_state.py
