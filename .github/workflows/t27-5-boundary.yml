name: T27.5 native boundary
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_t27_5_native_boundary.py
        env: {PYTHONPATH: .}
