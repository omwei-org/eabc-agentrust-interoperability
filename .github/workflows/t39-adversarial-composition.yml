name: T39 adversarial composition

on:
  workflow_dispatch:
  push:
    branches: [t32-execution-boundary-exclusivity]

jobs:
  t39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pytest
      - name: Run T39
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_t39_adversarial_composition.py
