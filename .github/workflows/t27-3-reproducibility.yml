name: T27.3 deterministic reproduction
on:
  workflow_dispatch:
jobs:
  reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_t27_3_reproducibility.py
        env: {PYTHONPATH: .}
