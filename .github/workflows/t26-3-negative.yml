name: T26.3 negative profile conformance

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  negative-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone public cMCP v0.5.0
        run: |
          git clone --branch v0.5.0 --depth 1 https://github.com/agentrust-io/cmcp.git upstream/cmcp
          echo "cMCP revision: $(git -C upstream/cmcp rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cMCP
        working-directory: upstream/cmcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run T26.3
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: pytest -q tests/test_t26_3_negative_conformance.py
