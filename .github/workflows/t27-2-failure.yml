name: T27.2 failure preservation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - run: pytest -q tests/test_t27_2_failure_preservation.py
        env: {PYTHONPATH: .}
