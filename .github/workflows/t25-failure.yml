name: T25.4 failure semantics

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  t25-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v4
      - name: Clone public cMCP v0.5.0
        run: |
          git clone --branch v0.5.0 --depth 1 https://github.com/agentrust-io/cmcp.git upstream/cmcp
          echo "cMCP revision: $(git -C upstream/cmcp rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cMCP
        working-directory: upstream/cmcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run T25.4
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: pytest -q tests/test_t25_failure_binding.py
