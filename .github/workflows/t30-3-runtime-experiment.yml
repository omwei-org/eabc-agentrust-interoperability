name: T30.3 actual cMCP runtime experiment

on:
  workflow_dispatch:
  push:
    branches:
      - t29-3-execution-binding

jobs:
  t30-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned cMCP revision
        run: |
          git clone https://github.com/agentrust-io/cmcp.git upstream/cmcp
          git -C upstream/cmcp checkout f8743e013786b094caaa70c336519834e73c74d5
          git -C upstream/cmcp rev-parse HEAD
          git -C upstream/cmcp tag --points-at HEAD || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e "upstream/cmcp[dev]"
      - name: Run native cMCP baseline before patch
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: |
          mkdir -p evidence/t30-3
          set -o pipefail
          pytest -q tests/test_t30_3_1_native_baseline.py | tee evidence/t30-3/native-baseline.txt

      - name: Run T31 pristine pinned-source ingress inventory
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: |
          mkdir -p evidence/t30-3/t31
          set -o pipefail
          pytest -q tests/test_t31_ingress_inventory.py | tee evidence/t30-3/t31/test-results.txt
          python scripts/build_t31_evidence.py

      - name: Apply disposable T30.3 runtime patch
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/t30_3_apply_patch.py

      - name: Run T30.3 and T30.3.1 experimental tests
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/cmcp:${{ github.workspace }}
        run: |
          set -o pipefail
          pytest -q tests/test_t30_3_preflight.py | tee evidence/t30-3/preflight-results.txt
          pytest -q tests/test_t30_3_runtime_experiment.py | tee evidence/t30-3/runtime-results.txt
          pytest -q tests/test_t30_3_1_toctou_concurrency.py | tee evidence/t30-3/toctou-concurrency-results.txt
      - name: Build evidence manifest
        if: always()
        run: |
          mkdir -p evidence/t30-3
          git rev-parse HEAD > evidence/t30-3/experiment-commit.txt
          git -C upstream/cmcp rev-parse HEAD > evidence/t30-3/upstream-commit.txt
          git -C upstream/cmcp tag --points-at HEAD > evidence/t30-3/upstream-tags.txt || true
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("evidence/t30-3")
          # Hash the complete evidence tree, including nested T31 evidence.
          # Exclude the manifest files themselves to avoid self-referential hashes.
          files = sorted(
              p for p in root.rglob("*")
              if p.is_file() and p.name not in {"manifest.json", "SHA256SUMS"}
          )
          manifest = {
              "files": [
                  {
                      "path": str(p.relative_to(root)),
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
                  for p in files
              ]
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (root / "SHA256SUMS").write_text(
              "\n".join(f"{item['sha256']}  {item['path']}" for item in manifest["files"]) + "\n"
          )
          PY
          cat evidence/t30-3/manifest.json
          cat evidence/t30-3/SHA256SUMS
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("evidence/t30-3")
          manifest = __import__("json").loads((root / "manifest.json").read_text())
          expected = {item["path"]: item["sha256"] for item in manifest["files"]}
          actual = {
              str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*")
              if p.is_file() and p.name not in {"manifest.json", "SHA256SUMS"}
          }
          assert actual == expected, "evidence manifest verification failed"
          print(f"Verified {len(actual)} evidence file hashes")
          PY
      - name: Upload T30.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t30-3-evidence
          path: evidence/t30-3/
